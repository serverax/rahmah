<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>رحمة — شروط الاستخدام</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>شروط الاستخدام</h1>
      <div class="header-sub">قواعد التعامل مع تطبيق رحمة.</div>
    </header>
    <main class="app-main">
      <div id="terms" aria-live="polite"><div class="state-loading">جارٍ التحميل...</div></div>
    </main>
    <nav class="app-bottom-nav" aria-label="التنقل السفلي">
      <a href="/">الرئيسية</a>
      <a href="/ask.html">اسأل</a>
      <a href="/answers.html">الإجابات</a>
      <a href="/library.html">المكتبة</a>
      <a href="/privacy.html">الخصوصية</a>
    </nav>
  </div>
  <script src="/assets/app.js"></script>
  <script>
    (async () => {
      const root = document.getElementById('terms');
      const r = await window.Rahma.fetchJson('/api/terms/status');
      if (!r.ok || !r.body || !r.body.terms) {
        root.innerHTML = '<div class="state-error">تعذّر تحميل شروط الاستخدام.</div>';
        return;
      }
      const t = r.body.terms;
      root.innerHTML = `<article class="card">
        <div class="card-title">${escapeHtml(t.title_ar)}</div>
        <div class="card-body" style="white-space:pre-line">${escapeHtml(t.body_ar)}</div>
      </article>`;
    })();
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  </script>
</body>
</html>
