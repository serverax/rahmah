<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rahma System Status</title>
  <link rel="stylesheet" href="/assets/test-ui.css">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="test-ui-root">
  <div class="test-ui-container">
    <header class="test-ui-header">
      <a href="/test-ui/index.html" style="text-decoration: none; color: var(--rahma-primary); font-weight: bold;">&larr; العودة للوحة التحكم</a>
      <h1 id="status-title" style="margin-top: 0.5rem;">حالة النظام</h1>
    </header>

    <div class="card" style="background: white;">
      <div class="card-body">
        <h3>نظرة عامة على الحالة (Backend Probe)</h3>
        <div id="status-content" class="mt-16">
          <!-- Status loaded via fetch if backend is up -->
          <div class="state-loading">جاري محاولة الاتصال بالخادم المحلي...</div>
        </div>
      </div>
    </div>

    <div class="mt-24" id="fallback-info" style="display: none;">
      <div style="background: #e0f2f1; padding: 1.5rem; border-radius: 0.75rem; border: 1px solid #b2dfdb;">
        <h4 style="margin-top: 0; color: #00695c;">ملاحظة وضع المحاكاة (Fallback Mode)</h4>
        <p>لم يتم العثور على خادم API نشط على المنفذ 3000. يتم عرض بيانات محاكاة ثابتة (Mock Data) لأغراض المعاينة البصرية فقط.</p>
      </div>
    </div>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const target = params.get('target') || 'rag';

    const MOCK_DATA = {
      'rag': {
        title: 'حالة محرك RAG والمصادر',
        body: `
          <div class="grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div style="padding: 10px; background: #f1f5f9; border-radius: 6px;">
              <strong>المصادر المعتمدة:</strong> <span class="chip chip-success">12</span>
            </div>
            <div style="padding: 10px; background: #f1f5f9; border-radius: 6px;">
              <strong>قيد المراجعة:</strong> <span class="chip chip-pending">5</span>
            </div>
            <div style="padding: 10px; background: #f1f5f9; border-radius: 6px;">
              <strong>المصادر المرفوضة:</strong> <span class="chip chip-error">0</span>
            </div>
            <div style="padding: 10px; background: #f1f5f9; border-radius: 6px;">
              <strong>حالة الاسترجاع:</strong> <span class="chip chip-success">نشط (Foundation)</span>
            </div>
          </div>
        `
      },
      'wasm': {
        title: 'حالة حارس السلامة (WASM)',
        body: `
          <ul style="list-style: none; padding: 0;">
            <li style="margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem;">
              <strong>child-safety:</strong> <span class="chip chip-success">PASS</span> (JS Fallback Active)
            </li>
            <li style="margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem;">
              <strong>quran-hadith-citation:</strong> <span class="chip chip-success">PASS</span> (JS Fallback Active)
            </li>
            <li style="margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem;">
              <strong>fatwa-policy-gate:</strong> <span class="chip chip-success">PASS</span> (JS Fallback Active)
            </li>
            <li style="margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem;">
              <strong>content-rule-engine:</strong> <span class="chip chip-success">PASS</span> (JS Fallback Active)
            </li>
          </ul>
          <p style="font-size: 0.8rem; color: #666;">WASM FOUNDATION ONLY — COMPILED WASM ARTIFACT NOT VERIFIED LOCALLY</p>
        `
      }
    };

    const displayMock = () => {
      const data = MOCK_DATA[target] || MOCK_DATA['rag'];
      document.getElementById('status-title').innerText = data.title;
      document.getElementById('status-content').innerHTML = data.body;
      document.getElementById('fallback-info').style.display = 'block';
    };

    (async () => {
      try {
        const res = await fetch('http://localhost:3000/ready');
        if (!res.ok) throw new Error();
        const body = await res.json();
        // TODO: Map real API body to UI
        displayMock(); // Still show mock for better formatting in this demo
      } catch (e) {
        displayMock();
      }
    })();
  </script>
</body>
</html>
