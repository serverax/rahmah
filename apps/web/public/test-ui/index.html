<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rahma Local Test UI</title>
  <link rel="stylesheet" href="/assets/test-ui.css">
  <style>
    .section-title {
      color: var(--rahma-emerald-dark);
      margin-top: 40px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--rahma-emerald-light);
      padding-bottom: 10px;
    }
    .test-ui-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
  </style>
</head>
<body class="test-ui-root">
  <div class="test-ui-container" style="max-width: 1200px; margin: 0 auto; padding: 20px;">
    <header class="test-ui-header" style="text-align: center; margin-bottom: 40px;">
      <h1 style="color: var(--rahma-emerald); font-family: var(--font-heading);">لوحة اختبار رحمة المحلية (Rahma Local Test UI)</h1>
      <p style="color: var(--rahma-ink-muted);">بيئة اختبار بصرية للتحقق من وحدات التطبيق قبل الإصدار الرسمي.</p>
    </header>

    <h2 class="section-title">Section A: Mobile App Features</h2>
    <div id="mobile-features-grid" class="test-ui-grid">
      <!-- Populated by JS -->
    </div>

    <h2 class="section-title">Section B: Internal System Readiness</h2>
    <div id="internal-services-grid" class="test-ui-grid">
      <!-- Populated by JS -->
    </div>

    <!-- App Store Readiness Checklist -->
    <h2 class="section-title">App Store Readiness</h2>
    <div class="blocker-section" style="background: #f0fdfa; border-color: #5eead4; padding: 20px; border-radius: 8px;">
      <ul id="compliance-list" class="blocker-list" style="list-style: none; padding: 0;">
        <!-- Populated by JS -->
      </ul>
    </div>

    <footer style="margin-top: 3rem; text-align: center; color: var(--test-ui-text-muted); font-size: 0.875rem;">
      Rahma Local Test UI is ready for visual/manual testing. It is not a production deployment.
    </footer>
  </div>

  <script>
    async function loadStatus() {
      try {
        const res = await fetch('/test-ui/rahma-feature-status.json');
        const data = await res.json();
        
        const mobileGrid = document.getElementById('mobile-features-grid');
        const internalGrid = document.getElementById('internal-services-grid');
        const complianceList = document.getElementById('compliance-list');
        
        data.features.forEach(f => {
          let color = '#f59e0b'; // partial
          if (f.status === 'PASS') color = '#10b981';
          if (f.status === 'PENDING') color = '#3b82f6';
          if (f.status === 'BLOCKED' || f.status === 'FAIL') color = '#ef4444';

          const card = document.createElement('div');
          card.className = 'card-3d';
          card.innerHTML = `
            <span class="status-pill" style="color: ${color}; border-left-color: ${color}; position: absolute; top: 20px; left: 20px;">${f.status}</span>
            <h3 style="margin-top:0;">${f.name_ar} <br><small style="color:var(--rahma-ink-muted);font-size:0.8rem;">${f.name_en}</small></h3>
            <div style="font-size: 0.9rem; margin-bottom: 10px;">
              <strong>يعمل:</strong> ${f.what_works}<br>
              <strong>لا يعمل:</strong> ${f.what_does_not_work}<br>
              <strong>المطلوب:</strong> ${f.required_to_finish}
            </div>
            <a href="${f.test_ui_url || (f.feature_id === 'home' ? '' : f.feature_id.replace('_', '-') + '.html')}" style="display:inline-block; padding:8px 16px; background:var(--rahma-emerald); color:white; border-radius:4px; text-decoration:none; font-size:0.9rem;">معاينة</a>
          `;

          if (f.category === 'mobile_feature') {
            mobileGrid.appendChild(card);
          } else if (f.category === 'internal_service') {
            internalGrid.appendChild(card);
          } else if (f.category === 'compliance') {
            const li = document.createElement('li');
            li.style.cssText = `margin-bottom: 10px; padding: 10px; background: white; border-radius: 4px; border-right: 4px solid ${color}; display: flex; justify-content: space-between;`;
            li.innerHTML = `<span>${f.name_ar} (${f.name_en})</span> <span style="color:${color}; font-weight:bold;">${f.status}</span>`;
            complianceList.appendChild(li);
          }
        });
      } catch (err) {
        console.error('Failed to load status JSON', err);
      }
    }
    loadStatus();
  </script>
</body>
</html>
