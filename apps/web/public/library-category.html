<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>رحمة — تصنيف المكتبة</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>تصنيف المكتبة</h1>
      <div class="header-sub">عرض المحتوى المعتمد ضمن التصنيف.</div>
    </header>
    <main class="app-main">
      <a class="btn btn-secondary" href="/library.html">العودة للمكتبة</a>
      <div id="items" class="mt-16" aria-live="polite"></div>
    </main>
    <nav class="app-bottom-nav" aria-label="التنقل السفلي">
      <a href="/">الرئيسية</a>
      <a href="/ask.html">اسأل</a>
      <a href="/answers.html">الإجابات</a>
      <a href="/library.html">المكتبة</a>
      <a href="/privacy.html">الخصوصية</a>
    </nav>
  </div>
  <script src="/assets/app.js"></script>
  <script src="/assets/library.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const category = params.get('category') || '';
      await window.Library.loadApprovedItems(document.getElementById('items'), category ? { category } : {});
    })();
  </script>
</body>
</html>
