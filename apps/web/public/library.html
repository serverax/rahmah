<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>رحمة — المكتبة والأذكار</title>
  <meta name="rahma-api-base" content="" />
  <!-- Use the new premium 3D design system -->
  <link rel="stylesheet" href="/assets/test-ui.css" />
</head>
<body>
  <div class="mobile-viewport">
    <header class="app-header">
      <a href="/" style="color: white; text-decoration: none; display: block; margin-bottom: 10px;">&larr; العودة</a>
      <h1>المكتبة والأذكار</h1>
      <div class="header-sub">محتوى إسلامي موثق ومراجع.</div>
    </header>

    <main class="app-main" style="padding: 20px; padding-bottom: 100px;">
      
      <div class="backend-status" data-rahma-status aria-live="polite"></div>

      <div class="input-3d" style="display: flex; gap: 10px; align-items: center;">
        <span>🔍</span>
        <input type="text" placeholder="ابحث في المكتبة..." style="border: none; background: transparent; outline: none; width: 100%; font-family: inherit;">
      </div>

      <h2 style="font-family: var(--font-heading); color: var(--rahma-emerald-dark); margin-top: 20px;">التصنيفات</h2>
      
      <div class="feature-grid" id="libraryCategories">
        <div class="state-loading" style="grid-column: span 2;">جارٍ تحميل التصنيفات...</div>
      </div>

      <h2 style="font-family: var(--font-heading); color: var(--rahma-emerald-dark); margin-top: 30px;">المحتوى المعتمد</h2>
      <div id="libraryContent">
        <div class="state-loading">جارٍ تحميل المحتوى...</div>
      </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="app-bottom-nav" aria-label="التنقل السفلي">
      <a href="/">
        <span class="nav-icon">🏠</span>
        <span>الرئيسية</span>
      </a>
      <a href="/ask.html">
        <span class="nav-icon">💬</span>
        <span>اسأل</span>
      </a>
      <a href="/answers.html">
        <span class="nav-icon">📝</span>
        <span>الإجابات</span>
      </a>
      <a href="/library.html" class="active">
        <span class="nav-icon">📚</span>
        <span>المكتبة</span>
      </a>
      <a href="/privacy.html">
        <span class="nav-icon">🛡️</span>
        <span>الخصوصية</span>
      </a>
    </nav>
  </div>
  
  <script src="/assets/app.js"></script>
  <script src="/assets/library.js"></script>
  <script>
    if (window.Library) {
      window.Library.init(
        document.getElementById('libraryCategories'),
        document.getElementById('libraryContent')
      );
    }
  </script>
</body>
</html>
