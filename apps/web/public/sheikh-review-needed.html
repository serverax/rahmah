<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>رحمة — تحتاج مراجعة</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>تحتاج مراجعة</h1>
      <div class="header-sub">العناصر التي ترجع للشيخ أو للمشرف للتأكد من المصدر.</div>
    </header>
    <main class="app-main">
      <a class="btn btn-secondary" href="/sheikh-dashboard.html">الرجوع للوحة التحكم</a>
      <div id="list" class="mt-16" aria-live="polite"><div class="state-loading">جارٍ التحميل...</div></div>
    </main>
    <nav class="app-bottom-nav" aria-label="التنقل السفلي">
      <a href="/">الرئيسية</a>
      <a href="/ask.html">اسأل</a>
      <a href="/answers.html">الإجابات</a>
      <a href="/library.html">المكتبة</a>
      <a href="/privacy.html">الخصوصية</a>
    </nav>
  </div>
  <script src="/assets/app.js"></script>
  <script src="/assets/sheikh.js"></script>
  <script>
    (async () => {
      const el = document.getElementById('list');
      const auth = await window.Sheikh.checkSheikhAuthStatus();
      if (!auth.ok) { window.Sheikh.renderArabicError(el, 'server_unavailable'); return; }
      if (!auth.configured) { window.Sheikh.renderAuthNotConfigured(el); return; }
      // Fetch /api/engine/review-queue (DB required → expect 503 today).
      const r = await window.Rahma.fetchJson('/api/engine/review-queue');
      if (!r.ok) { window.Sheikh.renderArabicEmpty(el, 'no_review_needed'); return; }
      const items = (r.body && Array.isArray(r.body.items)) ? r.body.items : [];
      if (items.length === 0) { window.Sheikh.renderArabicEmpty(el, 'no_review_needed'); return; }
      el.innerHTML = items.map((it) => `
        <div class="card"><div class="card-title">عنصر للمراجعة</div><div class="card-body">${escape(it.id || '')}</div></div>
      `).join('');
    })();
    function escape(s) { return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  </script>
</body>
</html>
