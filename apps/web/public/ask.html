<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>رحمة — اسأل الشيخ حسن</title>
  <meta name="rahma-api-base" content="" />
  <!-- Use the new premium 3D design system -->
  <link rel="stylesheet" href="/assets/test-ui.css" />
</head>
<body>
  <div class="mobile-viewport">
    <header class="app-header">
      <a href="/" style="color: white; text-decoration: none; display: block; margin-bottom: 10px;">&larr; العودة</a>
      <h1>اسأل الشيخ حسن</h1>
      <div class="header-sub">اكتبوا سؤالكم بوضوح، يصلكم الجواب مع المصادر بإذن الله.</div>
    </header>

    <main class="app-main" style="padding: 20px; padding-bottom: 100px;">
      
      <!-- Privacy Notice -->
      <div class="card-3d" style="background: rgba(20, 184, 166, 0.05); border-color: var(--rahma-emerald-light); padding: 15px;">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
          <span style="font-size: 1.5rem;">🛡️</span>
          <strong style="color: var(--rahma-emerald-dark);">سرية تامة</strong>
        </div>
        <p style="font-size: 0.85rem; margin: 0; color: var(--rahma-ink-muted);">
          جميع الأسئلة ترسل بسرية تامة. لن يتم عرض اسمك للعامة حتى وإن تمت الموافقة على نشر السؤال لتعم الفائدة.
        </p>
      </div>

      <div class="backend-status" data-rahma-status aria-live="polite"></div>

      <form id="askForm" autocomplete="off" class="mt-24">
        
        <label style="font-weight: 600; display: block; margin-bottom: 8px;">التصنيف</label>
        <select id="qcategory" name="category" class="input-3d" required>
          <option value="">— اختر التصنيف —</option>
          <option value="salah">الصلاة</option>
          <option value="zakat">الزكاة</option>
          <option value="fasting">الصيام</option>
          <option value="family">الأسرة</option>
          <option value="dua">الدعاء</option>
          <option value="general">عام</option>
        </select>

        <label style="font-weight: 600; display: block; margin-bottom: 8px;">نص السؤال</label>
        <textarea id="qtext" name="question" class="input-3d" style="min-height: 150px; resize: vertical;" minlength="5" maxlength="1000" placeholder="اكتبوا سؤالكم هنا..." required></textarea>

        <label style="display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; cursor: pointer;">
          <input type="checkbox" id="qpublic" style="margin-top: 5px;" checked />
          <span style="font-size: 0.9rem; color: var(--rahma-ink-muted);">أوافق على نشر الإجابة في المكتبة العامة (مع إخفاء هويتي تماماً) لتعم الفائدة.</span>
        </label>

        <button class="btn-3d" type="submit">إرسال السؤال</button>
      </form>
      
      <div id="askResult" class="mt-16 text-center" aria-live="polite"></div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="app-bottom-nav" aria-label="التنقل السفلي">
      <a href="/">
        <span class="nav-icon">🏠</span>
        <span>الرئيسية</span>
      </a>
      <a href="/ask.html" class="active">
        <span class="nav-icon">💬</span>
        <span>اسأل</span>
      </a>
      <a href="/answers.html">
        <span class="nav-icon">📝</span>
        <span>الإجابات</span>
      </a>
      <a href="/library.html">
        <span class="nav-icon">📚</span>
        <span>المكتبة</span>
      </a>
      <a href="/privacy.html">
        <span class="nav-icon">🛡️</span>
        <span>الخصوصية</span>
      </a>
    </nav>
  </div>
  
  <script src="/assets/app.js"></script>
  <script>
    document.getElementById('askForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const result = document.getElementById('askResult');
      result.innerHTML = '<div style="color: var(--rahma-emerald); font-weight: bold;">جارٍ الإرسال...</div>';
      const payload = {
        question_text_ar: document.getElementById('qtext').value.trim(),
        language: 'ar',
        display_language_preference: 'ar',
        is_anonymous: true,
      };
      try {
        const res = await fetch(`${window.Rahma.API_BASE}/api/ask-sheikh/questions`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const body = await res.json().catch(() => ({}));
        if (res.ok && body.ok) {
          result.innerHTML = `
            <div class="card-3d" style="background: #f0fdf4; border-color: #86efac; padding: 20px;">
              <div style="font-size: 3rem; margin-bottom: 10px;">✅</div>
              <strong style="color: #166534; font-size: 1.1rem;">تم استلام سؤالك</strong>
              <p style="color: #166534; font-size: 0.9rem; margin-top: 8px;">سيتم مراجعته من قبل الشيخ حسن وإعلامكم بالإجابة قريباً بإذن الله.</p>
            </div>
          `;
          document.getElementById('askForm').reset();
        } else {
          const code = body && body.error ? body.error : 'unknown_error';
          const msg = ({
            service_not_configured: 'الخدمة غير مهيأة بعد على الخادم.',
            auth_not_configured: 'الخدمة بانتظار تهيئة الحساب.',
            empty_question: 'يرجى كتابة سؤال صالح.',
          })[code] || 'تعذّر إرسال السؤال. حاولوا لاحقاً.';
          result.innerHTML = `<div style="color: var(--rahma-danger); padding: 10px; border: 1px solid var(--rahma-danger); border-radius: 8px;">${msg}</div>`;
        }
      } catch (_e) {
        result.innerHTML = `<div style="color: var(--rahma-danger); padding: 10px; border: 1px solid var(--rahma-danger); border-radius: 8px;">تعذّر الاتصال بالخادم. تأكد من اتصالك بالإنترنت.</div>`;
      }
    });
  </script>
</body>
</html>
