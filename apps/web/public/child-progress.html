<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>رحمة — تقدم الرحلة</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>تقدمك في رحلة الحسنات</h1>
      <div class="header-sub">معلوماتك محفوظة داخل الجهاز فقط، ولا تظهر لأحد آخر.</div>
    </header>
    <main class="app-main">
      <a class="btn btn-secondary" href="/child-game.html">العودة للعبة</a>
      <div id="progress" class="mt-16" aria-live="polite"></div>
      <p class="muted center mt-16">لا نجمع اسم الطفل أو رقم هاتفه أو عنوانه أو صورته أو موقعه.</p>
    </main>
    <nav class="app-bottom-nav" aria-label="التنقل السفلي">
      <a href="/">الرئيسية</a>
      <a href="/ask.html">اسأل</a>
      <a href="/answers.html">الإجابات</a>
      <a href="/library.html">المكتبة</a>
      <a href="/privacy.html">الخصوصية</a>
    </nav>
  </div>
  <script src="/assets/app.js"></script>
  <script src="/assets/hasanat-game.js"></script>
  <script>
    (() => {
      const p = window.HasanatGame.loadLocalProgress();
      const el = document.getElementById('progress');
      el.innerHTML = `
        <div class="card"><div class="card-title">نجوم الحسنات</div>
          <div class="card-body"><span class="chip chip-success">${p.stars | 0} نجمة</span></div></div>
        <div class="card mt-16"><div class="card-title">عدد السيناريوهات المكتملة</div>
          <div class="card-body">${(p.completed || []).length}</div></div>
        <div class="card mt-16"><div class="card-title">آخر لعب</div>
          <div class="card-body">${p.last_played ? p.last_played : 'لم تبدأ الرحلة بعد.'}</div></div>
      `;
    })();
  </script>
</body>
</html>
