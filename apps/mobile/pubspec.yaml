# Rahma mobile app — Flutter pubspec.
#
# This file is the operator-runnable seed: `flutter pub get` succeeds on a
# workstation with the Flutter SDK installed. The Android / iOS native
# directories will be generated by `flutter create .` (operator-side, NOT
# committed by the assistant — Flutter creates per-machine artefacts there).
#
# No production hostname is baked here. The mobile app reads
# RAHMA_API_BASE from a --dart-define passed at build time. The default
# value at compile-time is empty; the app refuses to talk to an empty
# base URL.
name: rahma_mobile
description: Rahma — Islamic mobile app (Arabic-RTL, single public endpoint = API only).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Minimal runtime deps; deliberately small. Operator adds more after first
  # `flutter create .` run.
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
