apiVersion: v1
kind: ResourceQuota
metadata:
  name: rahma-api-quota
  namespace: rahma-api
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rahma-data-quota
  namespace: rahma-data
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rahma-ai-quota
  namespace: rahma-ai
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 24Gi
    limits.cpu: "12"
    limits.memory: 48Gi
    pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rahma-app-quota
  namespace: rahma-app
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: rahma-default-limits
  namespace: rahma-api
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
---
