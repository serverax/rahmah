apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rahma-postgres-pvc
  namespace: rahma-data
  labels:
    app.kubernetes.io/name: rahma-postgres
    app.kubernetes.io/part-of: rahma
    ordinox.ai/project: rahma
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rahma-postgres
  namespace: rahma-data
  labels:
    app.kubernetes.io/name: rahma-postgres
    app.kubernetes.io/part-of: rahma
    ordinox.ai/project: rahma
spec:
  serviceName: rahma-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rahma-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahma-postgres
        app.kubernetes.io/part-of: rahma
        ordinox.ai/project: rahma
        ordinox.ai/component: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: rahma-postgres-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: rahma-postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: rahma-postgres-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rahma-postgres
  namespace: rahma-data
  labels:
    app.kubernetes.io/name: rahma-postgres
    app.kubernetes.io/part-of: rahma
    ordinox.ai/project: rahma
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rahma-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
