name: rahma-container-build
# Builds the Rahma API backend image and publishes it as
# ghcr.io/serverax/rahmah/rahma-api:latest (and sha-<commit>).
# Uses the root Dockerfile (backend/) so the published tag matches the
# mobile-only rename.

on:
  push:
    branches: [main]
    paths:
      - 'backend/app/**'
      - 'backend/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/rahma-container-build.yml'
  pull_request:
    paths:
      - 'backend/app/**'
      - 'backend/Dockerfile'
      - '.github/workflows/rahma-container-build.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rahmah/rahma-api

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (push only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR — no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: |
            ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}
          labels: |
            org.opencontainers.image.title=Rahma API
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push (main / manual)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=Rahma API
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
