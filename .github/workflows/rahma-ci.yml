name: rahma-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint + build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/app/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build (syntax check)
        run: npm run build

      - name: Test
        env:
          # Disable real auth / WhatsApp / external comms in CI
          SHEIKH_AUTH_REQUIRED: 'false'
          WHATSAPP_ENABLED: 'false'
          APP_STORE_COMPLIANCE_MODE: 'true'
        run: npm test
