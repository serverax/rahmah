name: rahma-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint

  web:
    name: Web RTL tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  mobile:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Test
        working-directory: apps/mobile
        run: flutter test

  fake-claim-scan:
    name: Overstated production claim scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan active code / manifests / workflows
        shell: bash
        run: |
          set -euo pipefail
          PATTERNS=(
            "RAG ACTIVE"
            "K3S VERIFIED"
            "payment successful"
            "verified by scholar"
            "complete Quran database"
            "complete Hadith database"
            "DEPLOYED AND HEALTHY"
          )
          BAD=""
          for pat in "${PATTERNS[@]}"; do
            MATCHES=$(grep -RIn -F "$pat" --exclude='rahma-ci.yml' backend/app/src deployment .github apps 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Fake-claim phrase found: \"$pat\""
              echo "$MATCHES"
              BAD="1"
            fi
          done
          if [ -n "$BAD" ]; then exit 1; fi
          echo "no fake-claim phrases in active code/manifests/workflows"
