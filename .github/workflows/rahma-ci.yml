name: rahma-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint + build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/app/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build (syntax check)
        run: npm run build

      - name: Test
        env:
          # Disable real auth / WhatsApp / external comms in CI
          SHEIKH_AUTH_REQUIRED: 'false'
          WHATSAPP_ENABLED: 'false'
          APP_STORE_COMPLIANCE_MODE: 'true'
        run: npm test

  fake-claim-scan:
    name: Overstated production claim scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan active code / manifests / workflows
        shell: bash
        run: |
          set -e
          # Phrases that must never appear as claims in ACTIVE code.
          # This job file is excluded — it necessarily names the phrases to scan for.
          # Reports/ may quote them when describing what was avoided.
          PATTERNS=(
            "RAG ACTIVE"
            "K3S VERIFIED"
            "payment successful"
            "verified by scholar"
            "complete Quran database"
            "complete Hadith database"
            "DEPLOYED AND HEALTHY"
          )
          BAD=""
          for pat in "${PATTERNS[@]}"; do
            # Scan application source only — tests may quote forbidden phrases in negative assertions.
            MATCHES=$(grep -RIn -F "$pat" --exclude='rahma-ci.yml' backend/app/src deployment .github apps 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Fake-claim phrase found: \"$pat\""
              echo "$MATCHES"
              BAD="1"
            fi
          done
          if [ -n "$BAD" ]; then exit 1; fi
          echo "no fake-claim phrases in active code/manifests/workflows"

      - name: Verify Arabic RTL checklist exists
        shell: bash
        run: |
          test -f docs/QA_ARABIC_RTL_CHECKLIST.md
          test -f docs/QA_ARABIC_RTL_FRONTEND_CHECKLIST.md
          echo "RTL checklists present"
