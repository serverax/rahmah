name: rahma-wasm-build
# Builds + tests the Rahma WASM policy workspace.
# Native tests assert the JS-parity contract; WASM build produces the
# `.wasm` artifacts that a future sidecar runtime will load.

on:
  push:
    branches: [main]
    paths:
      - 'wasm/**'
      - '.github/workflows/rahma-wasm-build.yml'
  pull_request:
    paths:
      - 'wasm/**'
  workflow_dispatch: {}

jobs:
  build:
    name: Native test + wasm32 build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Native tests
        run: cargo test --workspace --release

      - name: Build all crates for wasm32-unknown-unknown
        run: |
          for crate in quran-hadith-citation child-safety fatwa-policy-gate content-rule-engine; do
            cargo build --release --target wasm32-unknown-unknown -p "$crate"
          done

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rahma-wasm-${{ github.sha }}
          path: |
            wasm/target/wasm32-unknown-unknown/release/quran_hadith_citation.wasm
            wasm/target/wasm32-unknown-unknown/release/child_safety.wasm
            wasm/target/wasm32-unknown-unknown/release/fatwa_policy_gate.wasm
            wasm/target/wasm32-unknown-unknown/release/content_rule_engine.wasm
          if-no-files-found: error
          retention-days: 30
