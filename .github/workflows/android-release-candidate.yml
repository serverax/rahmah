name: android-release-candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-release-candidate.yml'

permissions:
  contents: read

jobs:
  build-android-release-candidate:
    name: Build Android release candidate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build APK release artifact
        run: flutter build apk --release
      - name: Build AAB release artifact
        run: flutter build appbundle --release
      - name: Generate release evidence report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../build-evidence
          {
            echo "# Android Release Candidate Evidence"
            echo
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "APK:"
            ls -lh build/app/outputs/flutter-apk/app-release.apk
            echo
            echo "AAB:"
            ls -lh build/app/outputs/bundle/release/app-release.aab
            echo
            echo "Store note: this workflow never submits to Google Play."
          } > ../../build-evidence/android-release-candidate.md
      - uses: actions/upload-artifact@v4
        with:
          name: rahma-android-release-candidate
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            build-evidence/android-release-candidate.md
          if-no-files-found: error
