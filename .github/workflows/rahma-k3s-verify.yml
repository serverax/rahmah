name: rahma-k3s-verify
# Lints + safety-scans the Rahma K3s manifests without touching any cluster.
# Runs on push to main + PR + manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - 'deployment/k3s/**'
      - 'scripts/guard/**'
      - 'scripts/security/**'
      - '.github/workflows/rahma-k3s-verify.yml'
  pull_request:
    paths:
      - 'deployment/k3s/**'
      - 'scripts/guard/**'
      - 'scripts/security/**'
  workflow_dispatch: {}

jobs:
  k3s-verify:
    name: K3s manifest + safety scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scope guard
        run: bash scripts/guard/verify-rahma-scope.sh

      - name: K3s manifest verify
        run: bash deployment/k3s/scripts/verify-rahma-manifests.sh

      - name: K8s safety scan
        run: bash scripts/security/rahma-k8s-safety-scan.sh

      - name: Secret scan
        run: bash scripts/security/rahma-secret-scan.sh
