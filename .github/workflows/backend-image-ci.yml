name: backend-image-ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/app/**'
      - '.github/workflows/backend-image-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/**'
      - '.github/workflows/backend-image-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rahmah/sakina-backend

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in to ghcr.io for push events on main (the path that actually
      # publishes). PRs build but never push, so no registry login is needed.
      - name: Login to GHCR (push only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR — no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: backend/app
          file: backend/app/Dockerfile
          push: false
          tags: |
            ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}
          labels: |
            org.opencontainers.image.title=Sakina Backend
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push (main / manual)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: backend/app
          file: backend/app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.title=Sakina Backend
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
