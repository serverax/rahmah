name: rahma-mobile-apk
# Builds a debug APK for internal testing.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/rahma-mobile-apk.yml'
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable

      - name: Pub get
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --dart-define=RAHMA_API_BASE=https://api.rahma.example.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rahma-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
