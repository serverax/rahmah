name: talos-k8s-validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-talos-manifests:
    name: Validate Talos/Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: YAML syntax
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          root = pathlib.Path("deployment/talos/rahma")
          for path in sorted(root.glob("*.yaml")):
              list(yaml.safe_load_all(path.read_text()))
              print(f"yaml ok: {path}")
          PY
      - name: kubectl client dry-run
        run: kubectl apply --dry-run=client -f deployment/talos/rahma/
      - name: Talos/Rahma policy validation
        shell: bash
        run: bash deployment/talos/rahma/validate-talos-manifests.sh
