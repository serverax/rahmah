# =============================================================================
# Rahma API — backend Deployment (rahma-api namespace).
# Canonical-path version. Mirrors deployment/k3s/rahma/app/30-backend-deployment.yaml
# but lands in the rahma-api namespace per Bundle 01 namespace layout.
# Apply ONLY against a verified Sakina-safe kubectl context.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahma-api
  namespace: rahma-api
  labels:
    app.kubernetes.io/name: rahma-api
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: rahma-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahma-api
        app.kubernetes.io/part-of: rahma
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rahma-api
          image: ghcr.io/serverax/rahmah/sakina-backend:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: rahma-platform-config
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rahma-api-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: rahma-api-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rahma-api-secrets
                  key: JWT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: rahma-api-secrets
                  key: SESSION_SECRET
            - name: SHEIKH_ALLOWED_EMAIL_HASHES
              valueFrom:
                secretKeyRef:
                  name: rahma-api-secrets
                  key: SHEIKH_ALLOWED_EMAIL_HASHES
            - name: ADMIN_ALLOWED_EMAIL_HASHES
              valueFrom:
                secretKeyRef:
                  name: rahma-api-secrets
                  key: ADMIN_ALLOWED_EMAIL_HASHES
            - name: AUTH_MODE
              value: "external"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
