# Sakina Backend Deployment (K3s staging)
# The container image below is produced by .github/workflows/backend-image-ci.yml.
# Until that workflow has successfully published the :main tag to ghcr.io, a
# pod created from this manifest will fail with ImagePullBackOff. Verify with
# `crane manifest` or by checking the workflow run before applying. Never
# apply to a context matching aks/prod/iterlaw (see scripts/k3s/deploy-sakina-staging.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakina-backend
  namespace: sakina-ai
  labels:
    app.kubernetes.io/name: sakina-backend
    app.kubernetes.io/part-of: sakina-islamic-app
    app.kubernetes.io/component: api
spec:
  replicas: 1  # staging-first
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sakina-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sakina-backend
        app.kubernetes.io/part-of: sakina-islamic-app
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sakina-backend
          # Image is produced by .github/workflows/backend-image-ci.yml on
          # push to main. The tag :main is rolling; :sha-<commit> is the
          # pinnable alternative for production cuts.
          #
          # DO NOT apply this manifest until:
          #   (a) The backend-image-ci workflow has successfully published
          #       the :main tag (verify with `crane manifest ghcr.io/...`
          #       or check the GitHub Actions run), AND
          #   (b) kubectl context is a safe Sakina K3s context. Apply MUST
          #       NOT target aks-iterlaw-we-prod or any prod cluster.
          # Deployment remains blocked until both conditions hold.
          image: ghcr.io/serverax/rahmah/sakina-backend:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: staging
            - name: API_SCOPE
              value: ibadat
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sakina-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sakina-secrets
                  key: JWT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: sakina-secrets
                  key: SESSION_SECRET
            - name: OLLAMA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: sakina-secrets
                  key: OLLAMA_BASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
