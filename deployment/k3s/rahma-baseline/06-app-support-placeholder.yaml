apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahma-app-support
  namespace: rahma-app
  labels:
    app.kubernetes.io/name: rahma-app-support
    app.kubernetes.io/project: rahma
    app.kubernetes.io/component: mobile-support
    app_status: placeholder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rahma-app-support
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahma-app-support
        app.kubernetes.io/project: rahma
        app.kubernetes.io/component: mobile-support
        app_status: placeholder
    spec:
      serviceAccountName: rahma-app-support
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app-support
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "http.server", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: rahma-app-support
  namespace: rahma-app
  labels:
    app.kubernetes.io/name: rahma-app-support
    app.kubernetes.io/project: rahma
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: rahma-app-support
