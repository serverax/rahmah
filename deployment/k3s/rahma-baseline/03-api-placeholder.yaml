apiVersion: v1
kind: ConfigMap
metadata:
  name: rahma-api-config
  namespace: rahma-api
  labels:
    app.kubernetes.io/project: rahma
    app.kubernetes.io/component: api
data:
  NODE_ENV: production
  RAHMA_ENV: production
  MOBILE_API_BASE_URL: http://rahma-api.rahma-api.svc.cluster.local
  AZAN_AUDIO_STORAGE_MODE: disabled
  NOTIFICATION_MODE: disabled
  SHEIKH_LOGIN_ENABLED: "false"
  ADMIN_LOGIN_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahma-api
  namespace: rahma-api
  labels:
    app.kubernetes.io/name: rahma-api
    app.kubernetes.io/project: rahma
    app.kubernetes.io/component: api
    app_status: placeholder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rahma-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahma-api
        app.kubernetes.io/project: rahma
        app.kubernetes.io/component: api
        app_status: placeholder
    spec:
      serviceAccountName: rahma-api
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              import json
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path in ['/health','/ready']:
                          self.send_response(200)
                          self.send_header('content-type','application/json')
                          self.end_headers()
                          self.wfile.write(json.dumps({'service':'rahma-api','status':'placeholder','path':self.path}).encode())
                      else:
                          self.send_response(404); self.end_headers()
                  def log_message(self, fmt, *args): print(fmt % args)
              HTTPServer(('0.0.0.0', 8080), H).serve_forever()
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: rahma-api-config
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: rahma-api
  namespace: rahma-api
  labels:
    app.kubernetes.io/name: rahma-api
    app.kubernetes.io/project: rahma
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: rahma-api
