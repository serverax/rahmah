  namespace: rahma-data
  labels:
    app.kubernetes.io/project: rahma
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rahma-postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rahma-api
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rahma-monitoring
      ports:
        - protocol: TCP
          port: 5432
