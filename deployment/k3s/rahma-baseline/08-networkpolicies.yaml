# NetworkPolicies are namespace-scoped. These policies intentionally live in
# the Rahma namespaces they protect; no IterLaw, OrdinoxAI, or other namespace
# is selected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rahma-default-deny-ingress
  namespace: rahma-api
  labels:
    app.kubernetes.io/project: rahma
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rahma-monitoring-to-api
  namespace: rahma-api
  labels:
    app.kubernetes.io/project: rahma
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rahma-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rahma-monitoring
      ports:
        - protocol: TCP
          port: 8080
---
