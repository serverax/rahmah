# =============================================================================
# SECRET TEMPLATE — DO NOT COMMIT REAL VALUES
# =============================================================================
# This file is a TEMPLATE. Every value below is a PLACEHOLDER and MUST be
# replaced before applying to any cluster.
#
# Recommended workflow:
#   1. Copy this file to a path EXCLUDED by .gitignore (e.g. `secrets/.local/`)
#      or render it via a secret store such as SOPS / sealed-secrets / Vault.
#   2. Replace every `REPLACE_ME_*` value with a real secret.
#   3. Apply with `kubectl apply -f <local-copy>.yaml` ONLY against the
#      operator-approved K3s staging context.
#
# DO NOT base64-encode placeholders here. We use `stringData` so Kubernetes
# performs the encoding at apply-time. That keeps placeholders human-readable
# and impossible to mistake for real secrets.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sakina-secrets
  namespace: sakina-ai
  labels:
    app.kubernetes.io/name: sakina
    app.kubernetes.io/part-of: sakina-islamic-app
  annotations:
    sakina.io/notice: "TEMPLATE ONLY. Replace every REPLACE_ME_* value before apply."
type: Opaque
stringData:
  # ---------------- Postgres -------------------------------------------------
  POSTGRES_USER: "REPLACE_ME_POSTGRES_USER"          # e.g. sakina_app
  POSTGRES_PASSWORD: "REPLACE_ME_POSTGRES_PASSWORD"  # strong random, ≥32 chars
  POSTGRES_DB: "REPLACE_ME_POSTGRES_DB"              # e.g. sakina_db

  # Full connection string used by backend (assembled here for convenience).
  # Host = service DNS of the Postgres StatefulSet inside the same namespace.
  DATABASE_URL: "postgresql://REPLACE_ME_POSTGRES_USER:REPLACE_ME_POSTGRES_PASSWORD@sakina-postgres:5432/REPLACE_ME_POSTGRES_DB?sslmode=disable"

  # ---------------- Backend app -------------------------------------------
  JWT_SECRET: "REPLACE_ME_JWT_SECRET"                # ≥64 random bytes b64
  SESSION_SECRET: "REPLACE_ME_SESSION_SECRET"

  # ---------------- AI / RAG (LOCAL inference only) -----------------------
  # Local Ollama / future local inference gateway. URL points to an in-cluster
  # service or a self-hosted endpoint. NEVER a managed-cloud LLM endpoint.
  OLLAMA_BASE_URL: "REPLACE_ME_OLLAMA_BASE_URL"      # e.g. http://ollama.sakina-ai:11434

  # ---------------- Ask Sheikh Hasan ---------------------------------------
  # User UUID corresponding to Sheikh Hasan's row in sakina_users.
  # Used by the moderator UI to identify the scholar. Not a secret per se,
  # but kept here so the operator can rotate without code changes.
  SHEIKH_HASAN_USER_ID: "REPLACE_ME_SHEIKH_HASAN_USER_ID"

  # API key the moderator / admin route gates trust during testing. Real
  # auth provider integration replaces this in a later sprint.
  ADMIN_API_KEY: "REPLACE_ME_ADMIN_API_KEY"

  # ---------------- WhatsApp notification (disabled by default) -----------
  # Adapter is NOT implemented yet. These placeholders exist so the operator
  # can wire them in a future sprint without changing the ConfigMap. The
  # backend never sends a real WhatsApp message until the adapter ships.
  WHATSAPP_PROVIDER: "REPLACE_ME_WHATSAPP_PROVIDER"            # e.g. meta-cloud
  WHATSAPP_API_TOKEN: "REPLACE_ME_WHATSAPP_API_TOKEN"          # provider token
  SHEIKH_HASAN_WHATSAPP_TO: "REPLACE_ME_SHEIKH_HASAN_WHATSAPP_TO"  # recipient id
