# =============================================================================
# Rahma API — placeholder Deployment + Service.
#
# This is the canonical-path PLACEHOLDER for the internal-only mobile API.
# It points at a small static-response image until the real
# ghcr.io/serverax/rahmah/sakina-backend:main image is wired in. The real
# Deployment lives at deployment/k3s/backend/rahma-api-deployment.yaml;
# operator swaps over once the real image is verified inside the cluster.
#
# ClusterIP only. NO public ingress. Mobile-only product target.
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: rahma-api
  namespace: rahma-api
  labels:
    app.kubernetes.io/name: rahma-api
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: api
spec:
  type: ClusterIP            # internal only
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: rahma-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahma-api
  namespace: rahma-api
  labels:
    app.kubernetes.io/name: rahma-api
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: api
  annotations:
    rahma.io/notice: "PLACEHOLDER — internal API only. Real image lives at ghcr.io/serverax/rahmah/sakina-backend:main."
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rahma-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahma-api
        app.kubernetes.io/part-of: rahma
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rahma-api-placeholder
          # nginx serves a static /health response; replace with the real
          # sakina-backend image once the operator confirms the build is good.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # nginx writes /var/run/*; tighten with the real image
            capabilities:
              drop: ["ALL"]
