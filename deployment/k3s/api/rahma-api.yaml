apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahma-api
  namespace: rahma-api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          image: ghcr.io/serverax/rahma-api:PLACEHOLDER-PINNED-TAG
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"