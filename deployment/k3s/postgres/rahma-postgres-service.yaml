apiVersion: v1
kind: Service
metadata:
  name: rahma-postgres
  namespace: rahma-data
  labels:
    app.kubernetes.io/name: rahma-postgres
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: database
spec:
  type: ClusterIP            # internal only — never LoadBalancer / NodePort
  clusterIP: None            # headless service for StatefulSet
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: rahma-postgres
