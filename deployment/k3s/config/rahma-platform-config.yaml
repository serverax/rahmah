# =============================================================================
# Rahma — platform ConfigMap (mobile-app-only, no public exposure).
#
# Rahma is mobile-only. The mobile app talks to the API via an internal
# Service DNS while public exposure is deferred. PUBLIC_API_URL is
# intentionally UNSET to avoid baking a placeholder hostname into the
# cluster. When the operator chooses the final domain, this ConfigMap
# is updated and re-applied; not before.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: rahma-platform-config
  namespace: rahma-api
  labels:
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/managed-by: k3s
data:
  APP_NAME: "Rahma"
  APP_ENV: "production"
  # Internal-only API URL (in-cluster Service DNS). This is what other Rahma
  # workloads use; mobile traffic terminates at the future ingress.
  INTERNAL_API_URL: "http://rahma-api.rahma-api.svc.cluster.local"
  # Internal-only AI gateway — never publicly exposed.
  AI_INTERNAL_URL: "http://ollama.ordinox-ai.svc.cluster.local:11434"
  # Public API URL is INTENTIONALLY UNSET. Will be set when the operator
  # picks the final production domain; until then mobile app builds must
  # NOT bake a hostname into the binary.
  PUBLIC_INGRESS_ENABLED: "false"
  DEFAULT_LANGUAGE: "ar"
  ENABLE_ARABIC_RTL: "true"
  ENABLE_ASK_SHEIKH_HASAN: "true"
  ENABLE_CHILDREN_ISLAMIC_GAME: "true"
  ENABLE_QURAN_FEATURES: "true"
  ENABLE_HADITH_FEATURES: "true"
  ENABLE_DUA_FEATURES: "true"
  ENABLE_DONATION_FEATURES: "true"
  # Backend safety flags — match the backend's env-driven contract.
  SCHOLAR_ANSWER_CITATION_REQUIRED: "true"
  PUBLIC_ANSWER_MODERATION_REQUIRED: "true"
  APP_STORE_COMPLIANCE_MODE: "true"
