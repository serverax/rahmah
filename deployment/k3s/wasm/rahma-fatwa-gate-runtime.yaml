# =============================================================================
# Rahma fatwa-policy-gate WASM runtime — REAL image manifest.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahma-fatwa-gate-wasm
  namespace: rahma
  labels:
    app: rahma-fatwa-gate-wasm
    tier: wasm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rahma-fatwa-gate-wasm
  template:
    metadata:
      labels:
        app: rahma-fatwa-gate-wasm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: bridge
          image: ghcr.io/serverax/rahmah/rahma-fatwa-gate-wasm:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rahma-fatwa-gate-wasm
  namespace: rahma
spec:
  selector:
    app: rahma-fatwa-gate-wasm
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
