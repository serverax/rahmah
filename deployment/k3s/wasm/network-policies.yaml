apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rahma-wasm-internal-only
  namespace: rahma-wasm
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rahma-api
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rahma-rag