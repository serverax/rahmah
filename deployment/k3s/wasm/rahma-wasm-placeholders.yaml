# =============================================================================
# Rahma WASM policy placeholders — internal ClusterIP services in rahma-ai.
#
# Service names below MATCH the verified live cluster:
#   rahma-fatwa-policy-gate-wasm.rahma-ai.svc.cluster.local
#   rahma-quran-hadith-citation-wasm.rahma-ai.svc.cluster.local
#   rahma-child-safety-wasm.rahma-ai.svc.cluster.local
#   rahma-content-rule-engine-wasm.rahma-ai.svc.cluster.local
#
# The four crates live under wasm/. Real .wasm images pending (CI workflow
# rahma-wasm-build produces the .wasm artifacts; a runtime image must be
# operator-chosen before these placeholders are swapped). Until then,
# placeholders use nginx-unprivileged.
#
# ClusterIP only. NO public exposure. NEVER reachable from outside the cluster.
# =============================================================================
---
# 1. fatwa-policy-gate
apiVersion: v1
kind: Service
metadata:
  name: rahma-fatwa-policy-gate-wasm
  namespace: rahma-ai
  labels:
    app.kubernetes.io/name: rahma-fatwa-policy-gate-wasm
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: wasm-policy
spec:
  type: ClusterIP
  ports: [{ name: http, port: 8080, targetPort: http, protocol: TCP }]
  selector: { app.kubernetes.io/name: rahma-fatwa-policy-gate-wasm }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahma-fatwa-policy-gate-wasm
  namespace: rahma-ai
  labels:
    app.kubernetes.io/name: rahma-fatwa-policy-gate-wasm
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: wasm-policy
  annotations:
    rahma.io/notice: "PLACEHOLDER — wasm/fatwa-policy-gate .wasm pending real runtime image"
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: rahma-fatwa-policy-gate-wasm } }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahma-fatwa-policy-gate-wasm
        app.kubernetes.io/part-of: rahma
        app.kubernetes.io/component: wasm-policy
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: placeholder
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080, protocol: TCP }]
          resources: { requests: { cpu: "10m", memory: "16Mi" }, limits: { cpu: "100m", memory: "64Mi" } }
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
---
