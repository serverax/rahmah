apiVersion: v1
kind: Service
metadata:
  name: rahma-redis
  namespace: rahma-data
  labels:
    app.kubernetes.io/name: rahma-redis
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP            # internal only — never LoadBalancer / NodePort
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app.kubernetes.io/name: rahma-redis
