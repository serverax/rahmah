# =============================================================================
# Rahma Redis (rahma-data namespace) — canonical-path copy of the manifest at
# deployment/k3s/rahma/data/20-redis.yaml. Both paths apply the same resource
# (kubectl is idempotent on apply). Operators should pick ONE of the two paths
# when scripting; this file is the bundle-canonical location.
#
# NEVER applied automatically. Apply only after a verified Sakina-safe kubectl
# context AND a `rahma-redis-secret` Secret exists in `rahma-data`.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rahma-redis
  namespace: rahma-data
  labels:
    app.kubernetes.io/name: rahma-redis
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: cache
spec:
  serviceName: rahma-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rahma-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahma-redis
        app.kubernetes.io/part-of: rahma
        app.kubernetes.io/component: cache
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - 'exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes --maxmemory-policy noeviction'
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rahma-redis-secret
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: rahma-redis
          app.kubernetes.io/part-of: rahma
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
