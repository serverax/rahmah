# =============================================================================
# Rahma Postgres — manifest only, NOT applied to any cluster in this sprint.
# =============================================================================
# Apply only after:
#   - rahma-data namespace exists on the confirmed Sakina kubectl context.
#   - rahma-postgres-secret has been created on the cluster via `kubectl create
#     secret` (NOT via this file).
#   - Operator has reviewed the storage class and PVC size for the target cluster.
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: rahma-postgres
  namespace: rahma-data
  labels:
    app.kubernetes.io/name: rahma-postgres
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: database
spec:
  type: ClusterIP            # ClusterIP only — never NodePort/LoadBalancer
  clusterIP: None            # headless for StatefulSet
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: rahma-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rahma-postgres
  namespace: rahma-data
  labels:
    app.kubernetes.io/name: rahma-postgres
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: database
spec:
  serviceName: rahma-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rahma-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahma-postgres
        app.kubernetes.io/part-of: rahma
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: rahma-postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rahma-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rahma-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Postgres needs writable /tmp + /var/run/postgresql
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: rahma-postgres
          app.kubernetes.io/part-of: rahma
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
