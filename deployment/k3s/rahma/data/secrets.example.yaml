# =============================================================================
# Rahma data-tier secrets — EXAMPLE ONLY.
# =============================================================================
# DO NOT APPLY THIS FILE WITH PLACEHOLDERS.
# CREATE REAL SECRETS ON THE SERVER USING `kubectl create secret`,
# NOT BY EDITING THIS FILE WITH REAL VALUES.
#
# This file is committed to git for documentation. The values are placeholders.
# The real Secret objects must be created at deploy time on the target cluster
# with `kubectl -n rahma-data create secret generic …`.
#
# Suggested commands (run on the operator's machine against a confirmed Sakina
# kubectl context — never against aks-iterlaw-we-prod or a non-Sakina shared cluster
# without explicit authorisation):
#
#   POSTGRES_PASSWORD="$(openssl rand -base64 32)"
#   REDIS_PASSWORD="$(openssl rand -base64 32)"
#   MINIO_ROOT_PASSWORD="$(openssl rand -base64 32)"
#
#   kubectl -n rahma-data create secret generic rahma-postgres-secret \
#     --from-literal=POSTGRES_DB='rahma' \
#     --from-literal=POSTGRES_USER='rahma_app' \
#     --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD"
#
#   kubectl -n rahma-data create secret generic rahma-redis-secret \
#     --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD"
#
#   kubectl -n rahma-data create secret generic rahma-minio-secret \
#     --from-literal=MINIO_ROOT_USER='rahma_minio_admin' \
#     --from-literal=MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD"
#
# Once created, the real generated values must NOT appear in any commit, any
# report, any chat transcript, or any log line. Operators should write them to
# a password-managed vault.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: rahma-postgres-secret-EXAMPLE
  namespace: rahma-data
  annotations:
    rahma.io/notice: "EXAMPLE ONLY — do not apply. Generate real Secret with kubectl create secret."
type: Opaque
stringData:
