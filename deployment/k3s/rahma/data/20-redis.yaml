# =============================================================================
# Rahma Redis — manifest only, NOT applied to any cluster in this sprint.
# =============================================================================
# Apply only after:
#   - rahma-data namespace exists on the confirmed Sakina kubectl context.
#   - rahma-redis-secret created on the cluster via `kubectl create secret`.
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: rahma-redis
  namespace: rahma-data
  labels:
    app.kubernetes.io/name: rahma-redis
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP            # never publicly exposed
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app.kubernetes.io/name: rahma-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rahma-redis
  namespace: rahma-data
  labels:
    app.kubernetes.io/name: rahma-redis
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: cache
spec:
  serviceName: rahma-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rahma-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahma-redis
        app.kubernetes.io/part-of: rahma
        app.kubernetes.io/component: cache
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          # Redis is launched with --requirepass coming from the Secret so the
          # password never appears in process listings or container args.
          command: ["sh", "-c"]
          args:
            - 'exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes --maxmemory-policy noeviction'
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rahma-redis-secret
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: rahma-redis
          app.kubernetes.io/part-of: rahma
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
