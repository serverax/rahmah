# =============================================================================
# Rahma backend Ingress (LEGACY older manifest — superseded by
# deployment/k3s/ingress/rahma-api-ingress.yaml in the canonical bundle path).
#
# This file is kept for historical / kustomize-compatibility reasons only.
# Operators should apply the canonical manifest, NOT this one.
#
# Rahma is mobile-app-only: there is no public website. The ONLY public
# endpoint is `api.<final-rahma-domain>`. `api.rahma.example` is a
# PLACEHOLDER until the operator confirms the production domain.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahma-backend
  namespace: rahma-app
  labels:
    app.kubernetes.io/name: rahma-backend
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: api
  annotations:
    # Traefik ingress class assumed; adjust to the cluster's actual class.
    kubernetes.io/ingress.class: "traefik"
    # TLS via cert-manager — uncomment + adjust issuer name AFTER cert-manager
    # is confirmed on the target cluster.
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
    - host: api.rahma.example   # PLACEHOLDER — operator replaces with final domain
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: rahma-backend
                port:
                  number: 3000
  # tls:
  #   - hosts:
  #       - api.rahma.example
  #     secretName: rahma-backend-tls
