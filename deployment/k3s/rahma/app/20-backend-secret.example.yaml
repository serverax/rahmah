# =============================================================================
# Rahma backend Secret — EXAMPLE ONLY. DO NOT APPLY WITH PLACEHOLDERS.
# =============================================================================
# Real Secret should be created on the cluster:
#
#   POSTGRES_PASSWORD="$(kubectl -n rahma-data get secret rahma-postgres-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)"
#   DB_URL="postgresql://rahma_app:${POSTGRES_PASSWORD}@rahma-postgres.rahma-data.svc.cluster.local:5432/rahma?sslmode=disable"
#   JWT_SECRET="$(openssl rand -base64 64)"
#   SESSION_SECRET="$(openssl rand -base64 64)"
#
#   kubectl -n rahma-app create secret generic rahma-backend-secret \
#     --from-literal=DATABASE_URL="$DB_URL" \
#     --from-literal=JWT_SECRET="$JWT_SECRET" \
#     --from-literal=SESSION_SECRET="$SESSION_SECRET"
#
# DO NOT echo these values into any commit, report, or log.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: rahma-backend-secret-EXAMPLE
  namespace: rahma-app
  annotations:
    rahma.io/notice: "EXAMPLE ONLY — do not apply."
type: Opaque
stringData:
  DATABASE_URL: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
  SESSION_SECRET: "CHANGE_ME"
