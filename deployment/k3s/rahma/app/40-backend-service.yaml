apiVersion: v1
kind: Service
metadata:
  name: rahma-backend
  namespace: rahma-app
  labels:
    app.kubernetes.io/name: rahma-backend
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: api
spec:
  type: ClusterIP            # ClusterIP only — never NodePort/LoadBalancer
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: rahma-backend
