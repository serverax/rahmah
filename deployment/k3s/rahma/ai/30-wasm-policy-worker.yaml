# =============================================================================
# WASM policy worker — FUTURE manifest, NOT applied. No real .wasm modules yet.
# =============================================================================
# The Sakina backend uses a JS fallback policy engine today. Real .wasm modules
# (sakina-citation-policy, sakina-pii-redactor, sakina-child-safety-policy,
# sakina-answer-publish-gate) are not yet built. This Deployment exists only
# as a manifest skeleton for when those modules ship.
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: rahma-wasm-policy
  namespace: rahma-security
  labels:
    app.kubernetes.io/name: rahma-wasm-policy
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: policy-engine
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: rahma-wasm-policy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahma-wasm-policy
  namespace: rahma-security
  labels:
    app.kubernetes.io/name: rahma-wasm-policy
    app.kubernetes.io/part-of: rahma
    app.kubernetes.io/component: policy-engine
  annotations:
    rahma.io/notice: "FUTURE — do not apply. No real .wasm modules exist yet."
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: rahma-wasm-policy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahma-wasm-policy
        app.kubernetes.io/part-of: rahma
        app.kubernetes.io/component: policy-engine
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wasm-policy
          image: REPLACE_ME_WASM_RUNTIME_IMAGE   # placeholder — operator-pinned
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
