# =============================================================================
# Rahma API ingress — api.rahma.ordinoxai.com → rahma-api Service (port 80).
# Apply ONLY after:
#   - DNS for api.rahma.ordinoxai.com points at the cluster ingress IP.
#   - cert-manager letsencrypt-prod ClusterIssuer is Ready.
#   - rahma-api Service exists in the rahma-api namespace.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahma-api
  namespace: rahma-api
  labels:
    app.kubernetes.io/part-of: rahma
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.rahma.ordinoxai.com
      secretName: rahma-api-tls
  rules:
    - host: api.rahma.ordinoxai.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rahma-api
                port:
                  number: 80
