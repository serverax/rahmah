# =============================================================================
# Rahma API ingress — the ONLY public endpoint for the mobile-only app.
#
# Host: api.rahma.example  (PLACEHOLDER — operator replaces with the final
# production hostname once DNS is verified.) Rahma has no public website
# and no public admin dashboard; this is the only ingress that should ever
# be applied.
#
# DO NOT APPLY until:
#   - The final hostname is chosen and a DNS A/CNAME record points at the
#     cluster ingress IP.
#   - cert-manager + the operator's chosen ClusterIssuer are confirmed
#     Ready on the target cluster.
#   - `rahma-api` Service exists in the `rahma-api` namespace.
#
# Do NOT modify Traefik / cert-manager configuration from this repo —
# those are operator-owned cluster resources.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahma-api
  namespace: rahma-api
  labels:
    app.kubernetes.io/part-of: rahma
  annotations:
    # Issuer name is the operator's choice. cert-manager.io/cluster-issuer
    # is left as a placeholder so this manifest does not silently bind to
    # an existing project's issuer if applied as-is.
    cert-manager.io/cluster-issuer: "REPLACE_ME_clusterissuer"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.rahma.example
      secretName: rahma-api-tls
  rules:
    - host: api.rahma.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rahma-api
                port:
                  number: 80
