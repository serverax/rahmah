# =============================================================================
# Rahma web ingress — rahma.ordinoxai.com → rahma-web service (port 80).
# Apply ONLY after:
#   - DNS A/CNAME for rahma.ordinoxai.com points at the cluster ingress IP.
#   - cert-manager is installed AND the letsencrypt-prod ClusterIssuer is Ready.
#   - rahma-web Service exists in the rahma-web namespace.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahma-web
  namespace: rahma-web
  labels:
    app.kubernetes.io/part-of: rahma
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - rahma.ordinoxai.com
      secretName: rahma-web-tls
  rules:
    - host: rahma.ordinoxai.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rahma-web
                port:
                  number: 80
