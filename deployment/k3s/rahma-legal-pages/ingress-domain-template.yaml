# Domain-ready template only.
# Replace <real-domain> after DNS exists and points to 148.251.247.56.
# Do not use rahma.ordinoxai.com unless that DNS record actually exists.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahma-legal-pages
  namespace: rahma-legal-pages
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: rahma-letsencrypt-prod
spec:
  tls:
    - hosts:
        - <real-domain>
      secretName: rahma-legal-pages-tls
  rules:
    - host: <real-domain>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rahma-legal-pages
                port:
                  number: 80
