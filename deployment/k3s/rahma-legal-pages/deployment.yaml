apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahma-legal-pages
  namespace: rahma-legal-pages
  labels:
    app.kubernetes.io/name: rahma-legal-pages
    app.kubernetes.io/part-of: rahma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rahma-legal-pages
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahma-legal-pages
        app.kubernetes.io/part-of: rahma
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: legal-pages
              mountPath: /usr/share/nginx/html/privacy.html
              subPath: privacy.html
              readOnly: true
            - name: legal-pages
              mountPath: /usr/share/nginx/html/terms.html
              subPath: terms.html
              readOnly: true
            - name: legal-pages
              mountPath: /usr/share/nginx/html/support.html
              subPath: support.html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /privacy.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /privacy.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: legal-pages
          configMap:
            name: rahma-legal-pages
