apiVersion: v1
kind: ConfigMap
metadata:
  name: rahma-api-config
  namespace: rahma-api
  labels:
    app.kubernetes.io/name: rahma-api
    app.kubernetes.io/part-of: rahma
data:
  NODE_ENV: production
  PORT: "3000"
  REDIS_URL: redis://rahma-redis.rahma-data.svc.cluster.local:6379
  APP_STORE_COMPLIANCE_MODE: "false"
  RAG_ENABLED: "true"
  AZAN_AUDIO_ENABLED: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rahma-web-config
  namespace: rahma-web
  labels:
    app.kubernetes.io/name: rahma-web
    app.kubernetes.io/part-of: rahma
data:
  API_BASE_URL: http://rahma-api.rahma-api.svc.cluster.local:3000
  PRIVACY_URL: ""
  TERMS_URL: ""
  SUPPORT_URL: ""
