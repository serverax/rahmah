apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahma-redis
  namespace: rahma-data
  labels:
    app.kubernetes.io/name: rahma-redis
    app.kubernetes.io/part-of: rahma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rahma-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahma-redis
        app.kubernetes.io/part-of: rahma
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: rahma-redis
  namespace: rahma-data
  labels:
    app.kubernetes.io/name: rahma-redis
    app.kubernetes.io/part-of: rahma
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rahma-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
