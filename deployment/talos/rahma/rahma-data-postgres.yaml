apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rahma-postgres-data
  namespace: rahma-data
  labels:
    app.kubernetes.io/name: rahma-postgres
    app.kubernetes.io/part-of: rahma
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rahma-postgres
  namespace: rahma-data
  labels:
    app.kubernetes.io/name: rahma-postgres
    app.kubernetes.io/part-of: rahma
spec:
  serviceName: rahma-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rahma-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahma-postgres
        app.kubernetes.io/part-of: rahma
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: rahma-postgres-secrets
                optional: false
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "rahma_user", "-d", "rahma"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "rahma_user", "-d", "rahma"]
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rahma-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: rahma-postgres
  namespace: rahma-data
  labels:
    app.kubernetes.io/name: rahma-postgres
    app.kubernetes.io/part-of: rahma
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rahma-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
