apiVersion: v1
kind: ConfigMap
metadata:
  name: rahma-ingress-template
  namespace: rahma-web
  labels:
    app.kubernetes.io/name: rahma-ingress-template
    app.kubernetes.io/part-of: rahma
  annotations:
    rahma.serverax.io/template-only: "true"
data:
  README: "Template only. Replace <real-domain> after DNS and HTTPS are verified. Do not apply as production without operator approval."
  rahma-ingress.yaml: |
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: rahma-public
      namespace: rahma-web
      annotations:
        kubernetes.io/ingress.class: traefik
        cert-manager.io/cluster-issuer: rahma-letsencrypt-prod
    spec:
      tls:
        - hosts:
            - <real-domain>
          secretName: rahma-public-tls
      rules:
        - host: <real-domain>
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: rahma-web
                    port:
                      number: 80
              - path: /api
                pathType: Prefix
                backend:
                  service:
                    name: rahma-api
                    port:
                      number: 3000
