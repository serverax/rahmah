apiVersion: v1
kind: ConfigMap
metadata:
  name: rahma-cert-manager-template
  namespace: rahma-security
  labels:
    app.kubernetes.io/name: rahma-cert-manager-template
    app.kubernetes.io/part-of: rahma
  annotations:
    rahma.serverax.io/template-only: "true"
data:
  README: "Template only. Replace <admin-email> and verify cert-manager before apply."
  clusterissuer.yaml: |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: rahma-letsencrypt-prod
    spec:
      acme:
        email: <admin-email>
        server: https://acme-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: rahma-letsencrypt-prod-account-key
        solvers:
          - http01:
              ingress:
                class: traefik
