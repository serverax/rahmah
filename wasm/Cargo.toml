[workspace]
resolver = "2"
members = [
  "quran-hadith-citation",
  "child-safety",
  "fatwa-policy-gate",
  "content-rule-engine",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
